name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# LEGACY AP-13: this pipeline lints, tests, and builds only. There is no Trivy, Checkov, or
# secret scanning here; the scans run once, out of band, in the assessment (docs/DESIGN.md §9).

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test with a 75% coverage gate on domain/ and api/
        run: pytest --cov=shiptrack.domain --cov=shiptrack.api --cov-fail-under=75 --cov-report=term-missing:skip-covered

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff terraform
      - name: Validate
        run: |
          terraform -chdir=terraform/envs/dev init -backend=false -input=false
          terraform -chdir=terraform/envs/dev validate

  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dist checks (no inline script or style; bundle under 200 KB gzipped)
        run: npm run check:dist

  package:
    runs-on: ubuntu-24.04
    needs: [python, ui]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install psycopg for the packaging test
        run: pip install --require-hashes -r requirements.txt
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tests/packaging/*.sh .github/scripts/*.sh tests/workflows/*.sh
      - name: Test the SSM runner against a fake aws
        run: tests/workflows/test_ssm_run.sh
      - name: Test the database bootstrap script against fake programs
        run: tests/workflows/test_db_bootstrap.sh
      - name: Build the release tarball (not uploaded)
        run: scripts/build_tarball.sh "${GITHUB_SHA::12}"
      - name: Install it on amazonlinux:2023 and exercise deploy, rollback, and nginx
        env:
          SKIP_BUILD: "1"
          PYTHON: python
        run: tests/packaging/run.sh "${GITHUB_SHA::12}"
