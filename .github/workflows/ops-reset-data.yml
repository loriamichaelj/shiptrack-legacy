name: ops-reset-data

# Deletes every shipment, its events, its proof-of-delivery records, and its SLA alerts from the
# database, removes the proof-of-delivery files from S3 and from each legacy host, and optionally
# seeds five demo shipments (MF0000000001 to MF0000000005) that can be looked up by hand. Carriers
# and the schema are kept. It cannot be undone (ADR-0013).
#
# Before running it: stop the live traffic, and let the events queue drain. An event for a shipment
# that is gone cannot be applied; it is retried and ends in the dead-letter queue, which alarms.
#
# It runs on every host in turn behind the `dev` environment's reviewer, and refuses unless
# `confirm` is exactly delete-all-shipments. The output is lines of numbers and the five synthetic
# tracking numbers; nothing else is shown.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type delete-all-shipments to confirm. This deletes every shipment and cannot be undone"
        required: true
        type: string
      seed_demo:
        description: "Create five demo shipments afterwards, to look up by tracking number"
        required: true
        type: choice
        default: "yes"
        options:
          - "yes"
          - "no"

permissions:
  contents: read

concurrency:
  group: deploy-legacy-dev
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$CONFIRM" != delete-all-shipments ]]; then
            echo "confirm must be exactly: delete-all-shipments" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Reset the data on every host, one at a time
        env:
          DOCUMENT: ShipTrack-ResetData
          SEED: ${{ inputs.seed_demo }}
          OUTPUT_FILE: ${{ runner.temp }}/reset-data-output.txt
          MAX_CONCURRENCY: "1"
          TIMEOUT_SECONDS: "900"
        run: |
          bucket=$(aws ssm get-parameter --name /shiptrack/platform/pod_bucket_name --query Parameter.Value --output text)
          echo "::add-mask::$bucket"
          export PARAMETERS="{\"confirm\":[\"delete-all-shipments\"],\"podBucket\":[\"$bucket\"],\"seed\":[\"$SEED\"]}"
          .github/scripts/ssm-run.sh
          # Counts and the synthetic tracking numbers only; safe to show.
          grep -E '^(RESET_DATA |SEEDED )' "$OUTPUT_FILE" || true
