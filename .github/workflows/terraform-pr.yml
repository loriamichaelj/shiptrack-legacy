name: terraform-pr

# Checks every pull request that touches Terraform. `check` needs no AWS access, so it also runs for
# pull requests from forks. `plan` assumes the plan role, which a fork cannot reach, and posts only
# resource addresses and actions as a comment, never attribute values. Plan files are never uploaded.
#
# LEGACY AP-13: there is no Checkov or Trivy here; the scans run once, out of band (design §9).

on:
  pull_request:
    paths:
      - "terraform/**"
      - "scripts/**"
      - "deploy/**"
      - ".github/scripts/terraform-ci.sh"
      - ".github/workflows/terraform-pr.yml"

permissions:
  contents: read

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.4"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff terraform
      - name: Validate
        run: |
          terraform -chdir=terraform/envs/dev init -backend=false -input=false
          terraform -chdir=terraform/envs/dev validate

  plan:
    needs: check
    # Forks receive no OIDC token, so the plan role is unreachable from them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Plan
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_VAR_owner: ${{ github.repository_owner }}
          TF_VAR_role_prefix: ${{ vars.ROLE_PREFIX }}
          SUMMARY_FILE: ${{ runner.temp }}/plan-summary.md
        run: .github/scripts/terraform-ci.sh plan
      - name: Comment the plan summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SUMMARY_FILE: ${{ runner.temp }}/plan-summary.md
        run: |
          {
            echo "### Terraform plan: legacy/dev"
            echo
            echo "Addresses and actions only; no values."
            echo
            cat "$SUMMARY_FILE"
          } >"$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file "$RUNNER_TEMP/comment.md"
