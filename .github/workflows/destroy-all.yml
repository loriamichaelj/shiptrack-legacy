name: destroy-all

# Takes down the whole legacy stack (ADR-0016): the Auto Scaling group and its hosts, the launch template,
# the SSM documents and parameters, the alarms, the log group, the artifacts bucket with every release in
# it, and the stack's roles. EVERY RELEASE ARTIFACT IS DELETED. The platform stack (database, load balancer,
# network, keys, and the `tg-legacy` target group) and the bootstrap roles are not touched. Two jobs, each in
# the `dev` environment and each needing the owner's approval: the first shows the addresses and actions,
# the second runs the destroy. Both fail unless `confirm` is exactly `all`.
#
# Run it after shiptrack-modern's destroy-all and before shiptrack-platform's: the platform's destroy
# refuses to start while this stack's parameters exist. A run that stops part-way can be dispatched again.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type all to take the legacy stack down"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tf-legacy-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.4"

jobs:
  plan:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [[ "$CONFIRM" == all ]] || { echo "::error::The confirmation does not match. Type all to take the legacy stack down."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Plan the destroy
        env:
          CONFIRM: ${{ inputs.confirm }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_VAR_owner: ${{ github.repository_owner }}
          TF_VAR_role_prefix: ${{ vars.ROLE_PREFIX }}
        run: .github/scripts/terraform-destroy.sh plan all

  destroy:
    needs: plan
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [[ "$CONFIRM" == all ]] || { echo "::error::The confirmation does not match. Type all to take the legacy stack down."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      # A fresh plan is made in this step and applied from the same step; no plan file is uploaded.
      - name: Destroy
        env:
          CONFIRM: ${{ inputs.confirm }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_VAR_owner: ${{ github.repository_owner }}
          TF_VAR_role_prefix: ${{ vars.ROLE_PREFIX }}
        run: .github/scripts/terraform-destroy.sh destroy all
