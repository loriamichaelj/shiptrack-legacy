# ShipTrack legacy: nginx fronts gunicorn (API) and serves the built UI as static files.
#
# LEGACY AP-16: no Content-Security-Policy, X-Content-Type-Options, Referrer-Policy, or frame
# protection is set on /ui/ or anywhere else.

map $http_x_forwarded_proto $shiptrack_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream shiptrack_app {
    server unix:/run/shiptrack/gunicorn.sock fail_timeout=0;
}

server {
    listen 80 default_server;
    server_name _;

    # 10 MiB file plus multipart overhead; the application enforces the exact 10 MiB limit and
    # answers with the JSON error envelope.
    client_max_body_size 11m;
    proxy_read_timeout 30s;

    include /etc/nginx/conf.d/shiptrack-headers.inc;

    # Bodies above client_max_body_size never reach the application, so answer in the same
    # envelope the application uses.
    error_page 413 @payload_too_large;
    location @payload_too_large {
        include /etc/nginx/conf.d/shiptrack-headers.inc;
        default_type application/json;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"POD files are limited to 10 MiB","request_id":null}}';
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript;

    location = /ui {
        return 301 /ui/;
    }

    # Hashed assets: cache forever. A missing asset is a plain 404, never the HTML shell.
    location /ui/assets/ {
        alias /opt/shiptrack/current/web/dist/assets/;
        include /etc/nginx/conf.d/shiptrack-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA shell: any other path under /ui/ returns index.html so client-side routes survive a
    # refresh. try_files falls back to an internal redirect that re-enters this location.
    location /ui/ {
        alias /opt/shiptrack/current/web/dist/;
        include /etc/nginx/conf.d/shiptrack-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /ui/index.html;
    }

    location / {
        proxy_pass http://shiptrack_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $shiptrack_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}
